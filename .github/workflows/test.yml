name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Acceptance tests create and delete real records in ZONE_EU_TEST_DOMAIN,
  # so they only run on demand.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -cover ./...

      - name: Docs are up to date
        run: |
          go generate ./tools/...
          git diff --exit-code -- docs/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: latest

  acceptance:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [build, lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Run Acceptance Tests
        env:
          ZONE_EU_USERNAME: ${{ secrets.ZONE_EU_USERNAME }}
          ZONE_EU_API_KEY: ${{ secrets.ZONE_EU_API_KEY }}
          ZONE_EU_TEST_DOMAIN: ${{ secrets.ZONE_EU_TEST_DOMAIN }}
          TF_ACC: "1"
        run: go test -v ./internal/provider/... -timeout 120m
