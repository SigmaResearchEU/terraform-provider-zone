name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Acceptance tests create and delete real records in ZONE_EU_TEST_DOMAIN,
  # so they only run on demand.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -cover ./...

      - name: Docs are up to date
        run: |
          go generate ./tools/...
          git diff --exit-code -- docs/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  acceptance:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [build, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Run Acceptance Tests
        env:
          ZONE_EU_USERNAME: ${{ secrets.ZONE_EU_USERNAME }}
          ZONE_EU_API_KEY: ${{ secrets.ZONE_EU_API_KEY }}
          ZONE_EU_TEST_DOMAIN: ${{ secrets.ZONE_EU_TEST_DOMAIN }}
          TF_ACC: "1"
        run: go test -v ./internal/provider/... -timeout 120m
